
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity Motors</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Velocity Motors</h1>
        <p>Explore some of the world's best performance cars.</p>
    </header>

    <!-- Main Gallery -->
    <main>

        <!-- Search -->
        <section class="controls">
            <input type="text" id="searchInput" placeholder="Search for a car...">

            <!-- Filter Buttons -->
            <div class="filter-buttons">
                <button class="filter-btn active" data-category="All">All</button>
                <button class="filter-btn" data-category="Supercar">Supercars</button>
                <button class="filter-btn" data-category="Sports">Sports</button>
                <button class="filter-btn" data-category="Luxury">Luxury</button>
            </div>

            <!-- Sorting -->
            <select id="sortSelect">
                <option value="default">Default Order</option>
                <option value="az">A-Z</option>
                <option value="rating">Highest Rated</option>
            </select>

            <button id="favoritesBtn">Show Favorites</button>
        </section>

        <!-- Gallery -->
        <section id="gallery" class="gallery">
            <!-- JavaScript displays cars here -->
        </section>

        <!-- Details -->
        <section id="details" class="details">
            <!-- Additional information appears here -->
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Velocity Motors</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
